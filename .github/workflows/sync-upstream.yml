name: Sync Upstream

on:
  schedule:
    # 北京时间每天 10:00、18:00、次日 00:00 执行
    # GitHub Actions 使用 UTC：
    # 02:00 UTC = 北京时间 10:00
    # 10:00 UTC = 北京时间 18:00
    # 16:00 UTC = 北京时间次日 00:00
    - cron: "0 2,10,16 * * *"

  # 支持手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/525815266/YYB-Go-Enhanced.git

      - name: Sync upstream and preserve workflow
        run: |
          # 备份当前工作流文件
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml

          # 拉取上游 main 分支
          git fetch upstream main

          # 切换到 main
          git checkout main

          # 重置为上游最新代码
          git reset --hard upstream/main

          # 恢复自己的同步工作流
          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml

          # 提交工作流文件
          git add .github/workflows/sync-upstream.yml
          git commit -m "保留上游同步工作流" || echo "工作流文件无变化"

          # 推送到自己的仓库
          git push origin main --force
